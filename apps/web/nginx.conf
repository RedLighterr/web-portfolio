# `/` dil yönlendirmesi (docs/MIMARI.md §3): önce `lang` cookie'si (dil seçici yazar), yoksa Accept-Language'in ilk
# dili Türkçeyse tr, değilse en. Dil bilgisi olmayan (botlar) → en. Aynı mantık: src/lib/i18n.ts preferredLocale.
map $http_accept_language $lang_from_header {
    ~*^tr   tr;
    default en;
}
map $cookie_lang $site_lang {
    tr      tr;
    en      en;
    default $lang_from_header;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yönlendirmeler göreli (Location: /tr/): nginx container'ın kendi portunu (80) yazmasın — dışarıdaki port
    # (8080, ya da öndeki TLS proxy'si) farklı.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Her şey bu origin'den: build'de inline script yok (theme-init.js harici), fontlar gömülü (src/styles/fonts.css),
    # küçük asset'ler data: olarak gömülmez (vite.config.ts), API aynı origin'de (/api/). Tek dış kaynak Cloudflare
    # Turnstile (iletişim formu, docs/MIMARI.md §7): script + iframe. Yeni bir dış kaynak eklenirse önce buraya.
    # Sonraki adımlarda: /auth/ (Keycloak), /demos/ ve /private-demos/ (kendi CSP'leriyle, §6a), prerender try_files (§6).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = / {
        # Yönlendirme dile göre değişir: önbelleğe alınmasın.
        expires -1;
        return 302 /$site_lang/;
    }

    # API: backend prod'da dışarıya açık değil, yalnızca bu proxy üzerinden erişilir.
    # X-Forwarded-For backend'in istemci IP'sini görmesi için (hız sınırı vb.).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite içerik hash'li dosya adları üretir → uzun önbellek güvenli. (`expires` kullanılıyor: location
    # içinde add_header, yukarıdaki güvenlik header'larının miras alınmasını keser.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Hash'siz, her deploy'da değişebilen küçük dosya: kısa önbellek.
    location = /theme-init.js {
        expires 5m;
    }

    # index.html asla önbelleğe alınmaz (yeni deploy'da eski bundle'a işaret etmesin).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
